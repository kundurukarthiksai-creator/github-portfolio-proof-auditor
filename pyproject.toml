[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-portfolio-proof-auditor"
version = "0.1.0"
description = "Audit public GitHub portfolio repositories for recruiter-facing proof quality."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Karthik Venkata Sai Reddy Kunduru" }]
dependencies = []

[project.scripts]
github-proof-auditor = "github_proof_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
